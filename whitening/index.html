<style>
  :root { --brand: #2563eb; --brand-dark: #1d4ed8; }
  .brand-bg { background-color: var(--brand); }
  .brand-bg:hover { background-color: var(--brand-dark); }
  .brand-text { color: var(--brand); }
  .brand-border { border-color: var(--brand); }
  .chip-active { background-color: var(--brand); border-color: var(--brand); color: #fff; }
  .step-fade { animation: stepFade .25s ease; }
  @keyframes stepFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .dot { transition: all .2s ease; }
  .copy-pop { animation: copyPop .3s ease; }
  @keyframes copyPop { 0% { transform: scale(.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

  <div class="max-w-md mx-auto px-4 py-6 pb-16">

    <!-- ヘッダー -->
    <header class="text-center mb-5">
      <h1 class="text-lg font-bold text-gray-800" id="headerTitle">口コミ投稿のご協力をお願いします</h1>
      <p class="text-xs text-gray-500 mt-1.5 leading-relaxed">
        タップして選ぶだけで、口コミ文章の下書きができます
      </p>
    </header>

    <!-- 進捗バー -->
    <div id="progressWrap" class="flex items-center justify-center gap-1.5 mb-5">
      <!-- JSでドット生成 -->
    </div>

    <!-- ウィザード本体 -->
    <div id="wizard" class="bg-white rounded-2xl shadow-sm p-5 mb-4 min-h-[260px] flex flex-col">
      <div id="stepContent" class="flex-1"></div>

      <div class="flex gap-2 mt-5">
        <button id="backBtn"
          class="hidden flex-1 border border-gray-300 text-gray-600 font-bold py-3 rounded-xl active:scale-[0.98] transition">
          戻る
        </button>
        <button id="nextBtn"
          class="flex-1 brand-bg text-white font-bold py-3 rounded-xl shadow-sm active:scale-[0.98] transition disabled:opacity-40 disabled:pointer-events-none">
          次へ
        </button>
      </div>
      <p id="validationMsg" class="text-xs text-red-500 text-center mt-2 hidden">1つ以上タップして選んでください</p>
    </div>

    <!-- 結果表示 -->
    <section id="resultSection" class="bg-white rounded-2xl shadow-sm p-4 mb-4 hidden step-fade">
      <h2 class="text-sm font-bold text-gray-700 mb-3">作成された口コミ文章（自由に編集できます）</h2>
      <p class="text-xs text-gray-500 mb-2">これはあくまで下書きです。ご自身の言葉に直してから投稿してください。</p>
      <textarea id="resultText" rows="8"
        class="w-full text-sm border border-gray-300 rounded-xl p-3 leading-relaxed focus:outline-none focus:ring-2"
        style="--tw-ring-color: var(--brand);"></textarea>

      <div class="mt-3 space-y-2">
        <button id="copyBtn"
          class="w-full bg-gray-800 hover:bg-gray-900 active:scale-[0.98] transition text-white font-bold py-3 rounded-xl shadow-sm">
          文章をコピー
        </button>
        <p id="copyMsg" class="text-center text-sm text-green-600 font-bold hidden copy-pop">✓ コピーしました！</p>

        <a id="googleMapBtn" href="#" target="_blank" rel="noopener noreferrer"
          class="block text-center w-full bg-green-500 hover:bg-green-600 active:scale-[0.98] transition text-white font-bold py-3 rounded-xl shadow-sm">
          Googleマップで口コミを書く
        </a>

        <button id="resetBtn"
          class="w-full text-gray-400 text-xs py-2 underline underline-offset-2">
          はじめからやり直す
        </button>
      </div>
    </section>

    <footer id="poweredByFooter" class="text-center mt-6 hidden">
      <a href="#" id="poweredByLink" target="_blank" rel="noopener noreferrer" class="text-[11px] text-gray-300 hover:text-gray-400">
        Powered by クチコミアシスト
      </a>
    </footer>

  </div>

<script>
  // ==================================================================
  // ★★★ ホワイトニングサロン版 ★★★
  // 【選択肢を追加する人へ】種類ごとに書き方のルールが違うので注意：
  // ・reason（きっかけ）は「〜で伺いました」に続く名詞で書く（例:「結婚式前のケア」）
  // ・menu（メニュー）は「〜を受けました」に続く名詞で書く
  // ・impression（感想）は「〜だった／〜できた」で終わる過去形の文で書く
  // ・recommend（おすすめしたい人）は「〜人」で終わる形で書く
  // ・【禁止】「白くなった」「◯トーン上がった」「真っ白」など効果を言い切る言葉は入れない
  //   （景品表示法・Googleのルール上のリスク。白さの感想はお客様が自分の言葉で書き足す形にする）
  // ==================================================================
  const DEFAULT_CHIP_DATA = {
    reason: [
      "初めてのホワイトニング", "結婚式前のケア", "写真撮影前のケア",
      "コーヒーや紅茶の着色のケア", "定期的なメンテナンス"
    ],
    impression: [
      "歯科衛生士さんの説明が丁寧だった", "完全個室で落ち着けた", "施術中リラックスできた",
      "スタッフさんが話しやすかった", "店内が清潔だった", "予約が取りやすかった",
      "料金がわかりやすかった", "子連れでも気兼ねなく過ごせた", "駅から近くて通いやすかった"
    ],
    recommend: [
      "初めてホワイトニングを試したい人", "歯の着色が気になる人", "大事な予定を控えている人",
      "丁寧に説明を聞きたい人", "仕事帰りに寄りたい人", "子育て中で時間が限られる人"
    ]
  };

  // ==================================================================
  // ★★★ 店舗の名簿（URLの末尾に ?store=店のID を付けて開く） ★★★
  // ==================================================================
  const STORES = {
    bian: {
      config: {
        brandColor: "#b08d57",
        brandColorDark: "#8f6f3f",
        headerTitle: "ご感想をお聞かせください",
        // Googleの口コミ投稿画面（place_idで直接開く）。
        // 本番では、オーナー用管理画面の「クチコミを増やす」で発行される専用リンクに差し替えてもよい
        googleMapReviewUrl: "https://search.google.com/local/writereview?placeid=ChIJv72Sz5XbAGAR37pCkQDcRmk",
        storeName: "Bian",
        areaKeyword: "中百舌鳥",
        showPoweredBy: true,
        poweredByUrl: "#"
      },
      chipData: {
        menu: [
          "初回体験（20分×1回）", "20分×2回のコース", "15分×3回のコース",
          "回数券", "ホワイトニングとフェイシャルWaxのセット"
        ]
      },
      // 同時に選ぶと矛盾する組み合わせ（きっかけ → 出さないメニュー）
      hideMenuWhenReason: {
        "定期的なメンテナンス": ["初回体験（20分×1回）"]
      }
    }
  };
  const DEFAULT_STORE_ID = "bian";

  const FREE_TEXT_HINTS = [
    "例）色の変化を一緒に鏡で確認してくれた、など",
    "例）歯の磨き方のアドバイスももらえた、など",
    "例）当日の予約でもすぐ案内してもらえた、など",
    "例）施術の流れを最初に説明してくれて安心した、など",
    "例）子どもを連れて行っても嫌な顔をされなかった、など"
  ];

  // ------------------------------------------------------------------
  // ここから下はロジック（通常は編集不要）
  // ------------------------------------------------------------------
  const storeId = new URLSearchParams(location.search).get("store") || DEFAULT_STORE_ID;
  const store = STORES[storeId];
  if (!store) {
    document.body.innerHTML =
      '<p style="text-align:center;margin-top:60px;color:#888;font-size:14px;">' +
      "店舗の設定が見つかりませんでした。URLをご確認ください。</p>";
    throw new Error("store not found: " + storeId);
  }
  const CONFIG = store.config;
  const CHIP_DATA = Object.assign({}, DEFAULT_CHIP_DATA, store.chipData || {});

  document.documentElement.style.setProperty("--brand", CONFIG.brandColor);
  document.documentElement.style.setProperty("--brand-dark", CONFIG.brandColorDark);
  document.getElementById("headerTitle").textContent = CONFIG.headerTitle;
  if (CONFIG.showPoweredBy) {
    document.getElementById("poweredByFooter").classList.remove("hidden");
    document.getElementById("poweredByLink").href = CONFIG.poweredByUrl;
  }

  // max: そのステップで選べる数。きっかけ・メニューは複数選ぶと矛盾しやすいので1つだけ
  const STEPS = [
    { key: "reason", title: "① ご来店のきっかけは？", required: true, max: 1 },
    { key: "menu", title: "② 受けたメニューは？", required: true, max: 1 },
    { key: "impression", title: "③ 良かったところは？", required: true, max: 3 },
    { key: "recommend", title: "④ こんな方におすすめしたい", required: true, max: 2 },
    { key: "free", title: "⑤ ご自身の言葉でひとこと（任意）", required: false }
  ];

  const selected = { reason: new Set(), menu: new Set(), impression: new Set(), recommend: new Set() };
  let currentStep = 0;
  let freeTextValue = "";

  function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function joinList(arr) {
    if (arr.length <= 1) return arr[0] || "";
    return arr.slice(0, -1).join("や") + "や" + arr[arr.length - 1];
  }
  // 感想（過去形の文）は「〜し、〜し、〜」でつなぐ
  function joinClauses(arr) {
    if (arr.length <= 1) return arr[0] || "";
    return arr.slice(0, -1).map(s => s + "し、").join("") + arr[arr.length - 1];
  }
  // メニュー名から（ ）の補足を外して、文章中で読みやすくする
  function menuInSentence(m) { return m.replace(/（.*?）/g, ""); }

  function visibleChips(key) {
    let list = CHIP_DATA[key];
    if (key === "menu" && store.hideMenuWhenReason) {
      const hidden = new Set();
      selected.reason.forEach(r => (store.hideMenuWhenReason[r] || []).forEach(m => hidden.add(m)));
      list = list.filter(m => !hidden.has(m));
      selected.menu.forEach(m => { if (hidden.has(m)) selected.menu.delete(m); });
    }
    return list;
  }

  function renderProgress() {
    const wrap = document.getElementById("progressWrap");
    wrap.innerHTML = "";
    STEPS.forEach((_, i) => {
      const dot = document.createElement("div");
      dot.className = "dot rounded-full " + (
        i === currentStep ? "w-6 h-2 brand-bg" :
        i < currentStep ? "w-2 h-2 brand-bg opacity-40" :
        "w-2 h-2 bg-gray-200"
      );
      wrap.appendChild(dot);
    });
  }

  function chipClass(active) {
    const base = "px-3 py-2.5 rounded-full text-sm border transition active:scale-95 select-none cursor-pointer";
    return active ? `${base} chip-active` : `${base} bg-gray-50 text-gray-700 border-gray-300`;
  }

  function renderStep() {
    const step = STEPS[currentStep];
    const content = document.getElementById("stepContent");
    document.getElementById("validationMsg").classList.add("hidden");

    if (step.key === "free") {
      content.innerHTML = `
        <h2 class="text-sm font-bold text-gray-700 mb-1">${step.title}</h2>
        <p class="text-xs text-gray-400 mb-3">白さの感想や、その日のエピソードなど、あなたの言葉で書き足すと伝わる口コミになります</p>
        <textarea id="freeTextInput" rows="4"
          class="w-full text-sm border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2"
          style="--tw-ring-color: var(--brand);"
          placeholder="${pickRandom(FREE_TEXT_HINTS)}"></textarea>
      `;
      content.querySelector("#freeTextInput").value = freeTextValue;
      content.querySelector("#freeTextInput").addEventListener("input", (e) => { freeTextValue = e.target.value; });
    } else {
      const chips = visibleChips(step.key).map(label => {
        const active = selected[step.key].has(label);
        return `<button type="button" data-value="${label}" class="${chipClass(active)}">${label}</button>`;
      }).join("");
      const hint = step.max === 1 ? "1つ選んでください" : `複数選べます（最大${step.max}つまで）`;
      content.innerHTML = `
        <h2 class="text-sm font-bold text-gray-700 mb-1">${step.title}</h2>
        <p class="text-xs text-gray-400 mb-3">${hint}</p>
        <div class="flex flex-wrap gap-2">${chips}</div>
      `;
      content.querySelectorAll("button[data-value]").forEach(chip => {
        chip.addEventListener("click", () => {
          const label = chip.dataset.value;
          const set = selected[step.key];
          if (set.has(label)) {
            set.delete(label);
            chip.className = chipClass(false);
            return;
          }
          if (step.max === 1) {
            // 1つだけ選ぶステップは、別のを押したら入れ替える
            set.clear();
            content.querySelectorAll("button[data-value]").forEach(b => b.className = chipClass(false));
          } else if (set.size >= step.max) {
            const msg = document.getElementById("validationMsg");
            msg.textContent = `選べるのは${step.max}つまでです`;
            msg.classList.remove("hidden");
            return;
          }
          document.getElementById("validationMsg").classList.add("hidden");
          set.add(label);
          chip.className = chipClass(true);
        });
      });
    }

    content.classList.remove("step-fade");
    void content.offsetWidth;
    content.classList.add("step-fade");

    document.getElementById("backBtn").classList.toggle("hidden", currentStep === 0);
    document.getElementById("nextBtn").textContent =
      currentStep === STEPS.length - 1 ? "口コミの下書きを作る" : "次へ";
    renderProgress();
  }

  document.getElementById("nextBtn").addEventListener("click", () => {
    const step = STEPS[currentStep];
    if (step.required && selected[step.key].size === 0) {
      const msg = document.getElementById("validationMsg");
      msg.textContent = step.max === 1 ? "1つタップして選んでください" : "1つ以上タップして選んでください";
      msg.classList.remove("hidden");
      return;
    }
    if (currentStep < STEPS.length - 1) { currentStep++; renderStep(); }
    else { showResult(); }
  });

  document.getElementById("backBtn").addEventListener("click", () => {
    if (currentStep > 0) { currentStep--; renderStep(); }
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    Object.values(selected).forEach(set => set.clear());
    freeTextValue = "";
    currentStep = 0;
    document.getElementById("resultSection").classList.add("hidden");
    document.getElementById("wizard").classList.remove("hidden");
    renderStep();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // ------------------------------------------------------------------
  // 口コミ下書きの組み立て
  // ・店名とエリア名は、書き出しで1回ずつだけ（何度も入れるとキーワードの詰め込みに見える）
  // ・言い回しと文の順番をランダムにして、同じ選択でも毎回ちがう文章になるようにする
  // ------------------------------------------------------------------
  function buildReviewText() {
    const reason = Array.from(selected.reason)[0];
    const menu = menuInSentence(Array.from(selected.menu)[0] || "");
    const impressions = shuffle(Array.from(selected.impression));
    const recommends = shuffle(Array.from(selected.recommend));
    const freeText = freeTextValue.trim();
    const { storeName, areaKeyword } = CONFIG;
    const isFirst = reason === "初めてのホワイトニング";

    const lines = [];
    const when = pickRandom(["", "", "", "先日、", "この前、", "今月、"]);
    lines.push(pickRandom([
      `${when}${reason}で、${areaKeyword}の${storeName}さんに伺いました。`,
      `${when}${areaKeyword}にある${storeName}さんに、${reason}で行ってきました。`,
      `${when}${reason}で${storeName}さん（${areaKeyword}）を利用しました。`,
      `${when}${reason}で、${areaKeyword}の${storeName}さんにお世話になりました。`,
      `${when}${areaKeyword}の${storeName}さんへ、${reason}で行ってきました。`,
      `${when}${reason}で${areaKeyword}の${storeName}さんを予約しました。`
    ]));

    // メニューは名詞のまま入る形だけにする（「回数券を受けました」のような不自然さを防ぐ）
    const menuLine = pickRandom([
      `今回は${menu}にしました。`,
      `${menu}でお願いしました。`,
      `メニューは${menu}です。`,
      `今回お願いしたのは${menu}です。`
    ]);
    // 初めての人だけの一言。「初めて」は書き出しで出ているので、ここでは繰り返さない
    const firstNote = isFirst ? pickRandom([
      "少し緊張していましたが、最初に流れを説明してもらえて安心しました。",
      "どんな感じか不安でしたが、落ち着いて受けられました。",
      "最初は緊張しましたが、流れが分かりやすかったです。",
      ""
    ]) : "";
    const blocks = [(menuLine + firstNote)];

    blocks.push(pickRandom([
      `${joinClauses(impressions)}のが良かったです。`,
      `${joinClauses(impressions)}のが印象に残っています。`,
      `${joinClauses(impressions)}ので、満足しています。`,
      `個人的には、${joinClauses(impressions)}のが嬉しかったです。`,
      `${joinClauses(impressions)}ところが良かったです。`,
      `${joinClauses(impressions)}のがありがたかったです。`
    ]));

    blocks.push(pickRandom([
      `${joinList(recommends)}には、おすすめしたいサロンです。`,
      `${joinList(recommends)}にはぴったりだと思います。`,
      `${joinList(recommends)}には、一度行ってみてほしいです。`,
      `${joinList(recommends)}には合っていると思います。`,
      `${joinList(recommends)}は、一度相談してみるといいと思います。`
    ]));

    // 書き出しの次は「メニュー」を置き、感想とおすすめだけ順番を入れ替える
    lines.push(blocks[0]);
    shuffle(blocks.slice(1)).forEach(b => lines.push(b));

    if (freeText) lines.push(freeText);

    lines.push(pickRandom([
      "また通いたいです。",
      "次回もお願いしたいです。",
      "ありがとうございました。",
      "また予約します。ありがとうございました。",
      "また伺います。",
      "次も同じメニューでお願いするつもりです。"
    ]));
    return lines.join("\n");
  }

  function showResult() {
    document.getElementById("wizard").classList.add("hidden");
    document.getElementById("resultText").value = buildReviewText();
    document.getElementById("resultSection").classList.remove("hidden");
    document.getElementById("copyMsg").classList.add("hidden");
    document.getElementById("googleMapBtn").href = CONFIG.googleMapReviewUrl;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  document.getElementById("copyBtn").addEventListener("click", async () => {
    const text = document.getElementById("resultText").value;
    const msg = document.getElementById("copyMsg");
    try { await navigator.clipboard.writeText(text); }
    catch (e) { const ta = document.getElementById("resultText"); ta.select(); document.execCommand("copy"); }
    msg.classList.remove("hidden");
    msg.classList.remove("copy-pop");
    void msg.offsetWidth;
    msg.classList.add("copy-pop");
    setTimeout(() => msg.classList.add("hidden"), 2500);
  });

  renderStep();
</script>
</body>
</html>
