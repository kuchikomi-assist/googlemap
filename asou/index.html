<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#6b5243">
<title>あそう歯科｜ご感想のお願い</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ==================================================================
     見た目：医院のホームページに合わせた「こげ茶 × 生成りのベージュ」。
     文字はホームページと同じく、見出しが明朝・本文がゴシック。やわらかい角丸で、待合室のような落ち着きを出す。
     ロゴは医院のホームページのロゴ画像（SVG）をそのまま使用
     ================================================================== */
  :root {
    --brown: #6b5243;
    --brown-deep: #54402f;
    --brown-soft: #f1ebe5;
    --band: #a89e94;
    --paper: #f5f1ec;
    --card: #fffdfa;
    --line: #e2d9cf;
    --ink: #3e3129;
    --sub: #7c6f66;
    --accent: #c9a36a;
    /* 医院のホームページと同じ組み合わせ：見出しは明朝、本文はゴシック */
    --round: "Times New Roman", "YuMincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    --gothic: "Helvetica Neue", "Arial", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Meiryo", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--gothic); background: var(--paper); }
  button, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  button:focus-visible, a:focus-visible { outline: 3px solid rgba(107, 82, 67, .35); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- デモ表示（本番では DEMO_MODE を false にすると消える） ---------- */
  .demo-bar {
    background: #3e3129; color: #fff; text-align: center; font-size: 11.5px; letter-spacing: .06em;
    padding: 7px 12px; line-height: 1.5;
  }

  /* ---------- ヘッダー（ホームページと同じ、グレージュの帯＋白地にロゴ） ---------- */
  .band { background: var(--band); color: #fff; text-align: center; font-size: 11.5px; letter-spacing: .08em; padding: 7px 12px; }
  .head { background: #fff; border-bottom: 1px solid var(--line); padding: 16px 16px 14px; }
  .logo { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .logo-img { display: block; width: min(270px, 78vw); height: auto; }

  .wrap { max-width: 440px; margin: 0 auto; padding: 0 16px 48px; }

  /* ---------- あいさつ ---------- */
  .greeting { margin: 20px 0 16px; padding: 22px 20px 18px; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
  .tagline { margin: 0 0 8px; font-family: var(--round); font-size: 12px; letter-spacing: .14em; color: var(--accent); }
  .greeting h1 { margin: 0; font-family: var(--round); font-weight: 700; font-size: 19px; letter-spacing: .06em; line-height: 1.6; color: var(--brown); white-space: pre-line; }
  .greeting p { margin: 8px 0 0; font-size: 12.5px; line-height: 1.8; color: var(--sub); }

  /* ---------- 進み具合（丸いドット5つ） ---------- */
  .progress { display: flex; align-items: center; justify-content: space-between; margin: 0 6px 10px; }
  .progress-label { font-size: 12px; color: var(--sub); letter-spacing: .1em; }
  .progress-label b { font-family: var(--round); font-size: 16px; color: var(--brown); margin-right: 2px; }
  .dots { display: flex; gap: 7px; }
  .dots i { width: 22px; height: 6px; border-radius: 3px; background: var(--line); transition: background .25s ease; }
  .dots i.done { background: var(--brown); }
  .dots i.now { background: var(--accent); }

  /* ---------- 質問カード ---------- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 18px 18px; box-shadow: 0 6px 22px rgba(62, 49, 41, .06); }
  .q-num { display: inline-block; font-family: var(--round); font-weight: 700; font-size: 11.5px; letter-spacing: .16em; color: #fff; background: var(--brown); border-radius: 999px; padding: 3px 11px; margin-bottom: 8px; }
  .q-title { margin: 0; font-family: var(--round); font-weight: 700; font-size: 18px; line-height: 1.5; color: var(--brown); }
  .q-hint { margin: 6px 0 16px; font-size: 12px; color: var(--sub); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 11px 14px; min-height: 46px;
    border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
    font-size: 14.5px; line-height: 1.4; text-align: left; user-select: none;
    transition: background .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
  }
  .chip::before { content: ""; flex: none; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #c9bdb2; background: #fff; transition: all .15s ease; }
  .chip:active { transform: scale(.97); }
  .chip.on { background: var(--brown); border-color: var(--brown); color: #fff; font-weight: 700; }
  .chip.on::before { border-color: #fff; background: #fff; box-shadow: inset 0 0 0 4px var(--brown); }

  .free { width: 100%; min-height: 120px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; font-size: 15px; line-height: 1.8; resize: vertical; }
  .free:focus, .result:focus { outline: none; border-color: var(--brown); box-shadow: 0 0 0 3px rgba(107, 82, 67, .14); }

  .actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px;
    padding: 12px 16px; border-radius: 999px; font-size: 15.5px; font-weight: 700; letter-spacing: .08em;
    text-decoration: none; transition: transform .1s ease, background .15s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--brown); color: #fff; box-shadow: 0 4px 14px rgba(107, 82, 67, .28); }
  .btn-primary:hover { background: var(--brown-deep); }
  .btn-back { flex: 0 0 34%; background: transparent; color: var(--sub); border: 1.5px solid var(--line); }
  .btn-outline { background: #fff; color: var(--brown); border: 1.5px solid var(--brown); }
  .btn[aria-disabled="true"] { background: #cbc2ba; color: #fff; box-shadow: none; pointer-events: none; }
  .msg { margin: 10px 0 0; text-align: center; font-size: 12.5px; color: #b3372f; }

  /* ---------- 下書き ---------- */
  .result-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .result-head span { font-size: 11.5px; color: var(--sub); }
  .notice { margin: 12px 0; padding: 10px 12px; border-radius: 10px; background: var(--brown-soft); font-size: 12.5px; line-height: 1.7; color: var(--brown-deep); }
  .result { width: 100%; min-height: 220px; padding: 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; font-size: 15px; line-height: 1.9; resize: vertical; }
  .stack { display: grid; gap: 10px; margin-top: 14px; }
  .how { margin: 16px 0 0; padding: 0; list-style: none; counter-reset: how; font-size: 12.5px; color: var(--sub); }
  .how li { counter-increment: how; display: flex; gap: 8px; line-height: 1.7; }
  .how li::before { content: counter(how); flex: none; font-family: var(--round); font-weight: 700; color: var(--brown); }
  .copied { margin: 0; text-align: center; font-size: 13px; font-weight: 700; color: #2f7a4b; }
  .reset { display: block; margin: 14px auto 0; font-size: 12px; color: var(--sub); text-decoration: underline; text-underline-offset: 3px; }
  .map-note { margin: 0; text-align: center; font-size: 11.5px; line-height: 1.7; color: var(--sub); }

  .fade { animation: fade .28s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .pop { animation: pop .3s ease; }
  @keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade, .pop { animation: none; } }

  footer { margin-top: 28px; text-align: center; font-size: 10.5px; color: #b4aaa1; }
  footer a { color: inherit; text-decoration: none; }
</style>
</head>

    if (arr.length <= 1) return arr[0] || "";
    return arr.slice(0, -1).map(s => s + "し、").join("") + arr[arr.length - 1];
  }

  function meets(need) {
    if (!need) return true;
    return Object.values(need).length === 0 ||
      Object.entries(need).some(([key, list]) => list.some(v => selected[key].has(v)));
  }
  function blockedByEarlier(key, label) {
    const order = ["reason", "visit", "impression", "recommend"];
    const earlier = order.slice(0, order.indexOf(key) + 1);
    return earlier.some(k => [...selected[k]].some(v => v !== label && (OVERLAP[v] || []).includes(label)));
  }
  function visibleChips(key) {
    const needs = key === "impression" ? IMPRESSION_NEEDS : key === "recommend" ? RECOMMEND_NEEDS : {};
    const list = CHIP_DATA[key].filter(v => meets(needs[v]) && !blockedByEarlier(key, v));
    // 前に戻って答えを変えたとき、合わなくなった選択は外す
    selected[key].forEach(v => { if (!list.includes(v)) selected[key].delete(v); });
    return list;
  }

  function renderProgress(done) {
    const n = STEPS.length;
    const marks = STEPS.map((_, i) => {
      const cls = done || i < currentStep ? "done" : i === currentStep ? "now" : "";
      return `<i class="${cls}"></i>`;
    }).join("");
    const label = done
      ? `<span class="progress-label"><b>下書き</b>ができました</span>`
      : `<span class="progress-label">質問 <b>${currentStep + 1}</b> / ${n}</span>`;
    document.getElementById("progress").innerHTML = `${label}<span class="dots" aria-hidden="true">${marks}</span>`;
  }

  function showMsg(text) {
    const msg = document.getElementById("validationMsg");
    msg.textContent = text;
    msg.hidden = !text;
  }

  function renderStep() {
    const step = STEPS[currentStep];
    const content = document.getElementById("stepContent");
    showMsg("");
    const head = `<span class="q-num">Q${currentStep + 1}</span><h2 class="q-title">${step.title}</h2>`;

    if (step.key === "free") {
      content.innerHTML = `${head}
        <p class="q-hint">なくても大丈夫です。ひとこと足すと、あなたらしい口コミになります</p>
        <textarea class="free" id="freeTextInput" placeholder="${pickRandom(FREE_TEXT_HINTS)}"></textarea>`;
      const input = content.querySelector("#freeTextInput");
      input.value = freeTextValue;
      input.addEventListener("input", e => { freeTextValue = e.target.value; });
    } else {
      const chips = visibleChips(step.key).map(label =>
        `<button type="button" class="chip${selected[step.key].has(label) ? " on" : ""}" data-value="${label}" aria-pressed="${selected[step.key].has(label)}">${label}</button>`
      ).join("");
      const hint = step.max === 1 ? "ひとつ選んでください" : `${step.max}つまで選べます`;
      content.innerHTML = `${head}<p class="q-hint">${hint}</p><div class="chips">${chips}</div>`;
      content.querySelectorAll(".chip").forEach(chip => chip.addEventListener("click", () => toggleChip(step, chip)));
    }

    content.classList.remove("fade");
    void content.offsetWidth;
    content.classList.add("fade");
    document.getElementById("backBtn").hidden = currentStep === 0;
    document.getElementById("nextBtn").textContent = currentStep === STEPS.length - 1 ? "下書きを作る" : "次へ";
    renderProgress(false);
  }

  function setChip(chip, on) {
    chip.classList.toggle("on", on);
    chip.setAttribute("aria-pressed", on);
  }
  function toggleChip(step, chip) {
    const set = selected[step.key];
    const label = chip.dataset.value;
    if (set.has(label)) { set.delete(label); setChip(chip, false); showMsg(""); refreshOverlap(step); return; }
    if (step.max === 1) {
      set.clear();
      document.querySelectorAll("#stepContent .chip").forEach(c => setChip(c, false));
    } else if (set.size >= step.max) {
      showMsg(`選べるのは${step.max}つまでです`);
      return;
    }
    showMsg("");
    set.add(label);
    setChip(chip, true);
    refreshOverlap(step);
  }
  // 同じ質問の中で、意味が重なる選択肢は片方を選んだら薄く隠す
  function refreshOverlap(step) {
    document.querySelectorAll("#stepContent .chip").forEach(c => {
      const v = c.dataset.value;
      c.hidden = !selected[step.key].has(v) && [...selected[step.key]].some(s => (OVERLAP[s] || []).includes(v));
    });
  }

  document.getElementById("nextBtn").addEventListener("click", () => {
    const step = STEPS[currentStep];
    if (step.required && selected[step.key].size === 0) {
      showMsg(step.max === 1 ? "ひとつタップして選んでください" : "ひとつ以上タップして選んでください");
      return;
    }
    if (currentStep < STEPS.length - 1) { currentStep++; renderStep(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    else showResult();
  });
  document.getElementById("backBtn").addEventListener("click", () => {
    if (currentStep > 0) { currentStep--; renderStep(); }
  });
  document.getElementById("resetBtn").addEventListener("click", () => {
    Object.values(selected).forEach(s => s.clear());
    freeTextValue = "";
    currentStep = 0;
    document.getElementById("resultSection").hidden = true;
    document.getElementById("wizard").hidden = false;
    renderStep();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // ------------------------------------------------------------------
  // 下書きの組み立て
  // ・医院名とエリア名は、書き出しで1回ずつだけ（何度も入れるとキーワードの詰め込みに見える）
  // ・言い回しと文の順番をランダムにして、同じ選択でも毎回ちがう文章になるようにする
  // ------------------------------------------------------------------
  function buildReviewText() {
    const reason = REASON_TEXT[[...selected.reason][0]];
    const visit = pickRandom(VISIT_TEXT[[...selected.visit][0]]);
    const impressions = shuffle([...selected.impression]);
    const recommends = shuffle([...selected.recommend]);
    const freeText = freeTextValue.trim();
    const { storeName: s, areaKeyword: a } = CONFIG;

    const lines = [pickRandom([
      `${reason}、${a}の${s}さんを受診しました。`,
      `${reason}、${a}にある${s}さんに伺いました。`,
      `${reason}、${s}さん（${a}）にお世話になりました。`,
      `${reason}、${a}の${s}さんを選びました。`
    ]), visit];

    const blocks = [pickRandom([
      `${joinClauses(impressions)}のが良かったです。`,
      `${joinClauses(impressions)}のが印象に残っています。`,
      `${joinClauses(impressions)}ので、安心できました。`,
      `個人的には、${joinClauses(impressions)}のが嬉しかったです。`,
      `${joinClauses(impressions)}ところが良かったです。`
    ])];
    blocks.push(pickRandom([
      `${joinWith(recommends, "や")}には、おすすめしたい歯医者さんです。`,
      `${joinWith(recommends, "や")}には合っていると思います。`,
      `${joinWith(recommends, "や")}に、一度行ってみてほしいです。`,
      `${joinWith(recommends, "や")}に合う歯医者さんだと思います。`
    ]));
    shuffle(blocks).forEach(b => lines.push(b));
    if (freeText) lines.push(freeText);

    const closings = ["これからもよろしくお願いします。", "また次回もよろしくお願いします。", "ありがとうございました。", "これからも通いたいと思います。"];
    if (CONFIG.justOpened) closings.push("開院したばかりの医院なので、これからも楽しみです。");
    lines.push(pickRandom(closings));
    return lines.join("\n");
  }

  function fitHeight(ta) {
    ta.style.height = "auto";
    ta.style.height = ta.scrollHeight + 4 + "px";
  }
  document.getElementById("resultText").addEventListener("input", e => fitHeight(e.target));

  function showResult() {
    document.getElementById("wizard").hidden = true;
    const ta = document.getElementById("resultText");
    ta.value = buildReviewText();
    document.getElementById("resultSection").hidden = false;
    fitHeight(ta); // 表示してからでないと高さが測れない
    document.getElementById("copyMsg").hidden = true;
    const btn = document.getElementById("googleMapBtn");
    const note = document.getElementById("mapNote");
    if (CONFIG.DEMO_MODE) {
      btn.removeAttribute("href");
      btn.setAttribute("aria-disabled", "true");
      btn.textContent = "Googleマップで口コミを書く";
      note.textContent = "デモのため、ここでは投稿画面に進みません。本番では、このボタンからあそう歯科のGoogle口コミ投稿画面が開きます";
      note.hidden = false;
    } else {
      btn.href = CONFIG.googleMapReviewUrl;
      btn.removeAttribute("aria-disabled");
      note.hidden = true;
    }
    renderProgress(true);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  document.getElementById("copyBtn").addEventListener("click", async () => {
    const ta = document.getElementById("resultText");
    try { await navigator.clipboard.writeText(ta.value); }
    catch (e) { ta.select(); document.execCommand("copy"); }
    const msg = document.getElementById("copyMsg");
    msg.hidden = false;
    msg.classList.remove("pop"); void msg.offsetWidth; msg.classList.add("pop");
    setTimeout(() => { msg.hidden = true; }, 2500);
  });

  renderStep();
</script>
</body>
</html>
